<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Splitz A: "S" fatiado -->
  <defs>
    <linearGradient id="ga" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <clipPath id="cutTop"><polygon points="0,0 120,0 120,34 0,78"/></clipPath>
    <clipPath id="cutBot"><polygon points="0,86 120,42 120,120 0,120"/></clipPath>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#ga)"/>
  <g clip-path="url(#cutTop)">
    <text x="60" y="90" transform="translate(-5,-2)" font-size="88" font-weight="900" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif">S</text>
  </g>
  <g clip-path="url(#cutBot)">
    <text x="60" y="90" transform="translate(5,2)" font-size="88" font-weight="900" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif">S</text>
  </g>
</svg>
