<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Splitz logo: moeda dividida ao meio -->
  <defs>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="gPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#db2777"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <!-- metade esquerda (azul) -->
  <g transform="translate(-3,0)">
    <path d="M60 16 L52 42 L67 62 L54 82 L60 104 A44 44 0 0 1 60 16 Z" fill="url(#gBlue)"/>
    <text x="38" y="70" font-size="28" font-weight="bold" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif">€</text>
  </g>
  <!-- metade direita (rosa) -->
  <g transform="translate(3,0)">
    <path d="M60 16 L52 42 L67 62 L54 82 L60 104 A44 44 0 0 0 60 16 Z" fill="url(#gPink)"/>
    <text x="84" y="69" font-size="24" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif">♥</text>
  </g>
</svg>
